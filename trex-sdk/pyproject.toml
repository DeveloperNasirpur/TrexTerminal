# ═══════════════════════════════════════════════════════════════════
# Trex Terminal — Python SDK
# Modern declarative packaging (PEP 517 / 518 / 621).
# ═══════════════════════════════════════════════════════════════════

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "trex-terminal"
version = "1.0.0"
description = "Feed a Trex Terminal chart from any Python backend over WebSocket — simple sync API or full async."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Trex Terminal" }]
keywords = ["trading", "charts", "websocket", "tradingview", "realtime", "ohlc", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

# The only hard runtime dependency is the websockets transport.
# Pydantic is optional — the models work as plain dataclasses without it.
dependencies = ["websockets>=16,<17"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "coverage>=7"]

[project.urls]
Documentation = "https://github.com/trex-terminal/trex-sdk"
Source = "https://github.com/trex-terminal/trex-sdk"

# ── hatchling: build the src/ layout ─────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/trex"]

# ── ruff: lint + format ──────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ── mypy: strict typing ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

# ── pytest ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
