<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trex Trading Terminal — Advanced Chart Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; width: 100%; overflow: hidden; background: #0b0e11; color: #eaecef; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
      #root { height: 100%; width: 100%; }
      #trex-loader { position: fixed; inset: 0; z-index: 10000; overflow-y: auto; padding: 24px 16px; background: radial-gradient(ellipse at top left, rgba(240, 185, 11, 0.08), transparent 50%), radial-gradient(ellipse at bottom right, rgba(14, 203, 129, 0.06), transparent 50%), #0b0e11; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.5s ease; }
      #trex-loader.fade-out { opacity: 0; pointer-events: none; }
      #trex-loader::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(240, 185, 11, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(240, 185, 11, 0.04) 1px, transparent 1px); background-size: 50px 50px; mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%); animation: gridPulse 8s ease-in-out infinite; }
      @keyframes gridPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      .trex-card { position: relative; z-index: 2; margin: auto; width: 460px; max-width: 92vw; background: linear-gradient(145deg, rgba(30, 35, 41, 0.95), rgba(24, 26, 32, 0.95)); border: 1px solid rgba(240, 185, 11, 0.15); border-radius: 20px; padding: 40px 36px 32px; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03) inset, 0 0 60px rgba(240, 185, 11, 0.08); backdrop-filter: blur(20px); animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
      @keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .trex-logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
      .trex-logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #f0b90b 0%, #fcd535 50%, #f0b90b 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(240, 185, 11, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1) inset; position: relative; }
      .trex-logo-icon::after { content: ''; position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.3) 50%, transparent 60%); animation: shimmer 3s ease-in-out infinite; }
      @keyframes shimmer { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
      .trex-logo-icon svg { width: 26px; height: 26px; stroke: #0b0e11; stroke-width: 2.5; fill: none; }
      .trex-logo-text { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #f0b90b 0%, #fcd535 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      .trex-tagline { text-align: center; color: #848e9c; font-size: 13px; margin-bottom: 28px; letter-spacing: 0.3px; }
      .trex-tagline strong { color: #eaecef; font-weight: 600; }
      .trex-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
      .trex-mode { position: relative; background: rgba(43, 49, 57, 0.5); border: 1.5px solid rgba(43, 47, 54, 0.8); border-radius: 14px; padding: 20px 16px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-align: center; overflow: hidden; }
      .trex-mode::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, transparent, rgba(240, 185, 11, 0.08)); opacity: 0; transition: opacity 0.2s; }
      .trex-mode:hover { border-color: rgba(240, 185, 11, 0.5); background: rgba(43, 49, 57, 0.8); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
      .trex-mode:hover::before { opacity: 1; }
      .trex-mode.selected { border-color: #f0b90b; background: rgba(240, 185, 11, 0.08); box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.15); }
      .trex-mode-icon { width: 44px; height: 44px; margin: 0 auto 10px; background: rgba(11, 14, 17, 0.6); border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
      .trex-mode:hover .trex-mode-icon, .trex-mode.selected .trex-mode-icon { background: rgba(240, 185, 11, 0.15); }
      .trex-mode-icon svg { width: 22px; height: 22px; stroke: #f0b90b; stroke-width: 2; fill: none; }
      .trex-mode-title { font-size: 15px; font-weight: 700; color: #eaecef; margin-bottom: 4px; }
      .trex-mode-desc { font-size: 11px; color: #848e9c; line-height: 1.4; }
      .trex-url-wrap { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); margin-bottom: 0; }
      .trex-url-wrap.show { max-height: 80px; opacity: 1; margin-bottom: 16px; }
      .trex-url-input { width: 100%; height: 44px; background: rgba(11, 14, 17, 0.6); border: 1.5px solid rgba(43, 47, 54, 0.8); border-radius: 10px; color: #eaecef; padding: 0 14px; font-size: 13px; font-family: 'JetBrains Mono', monospace; transition: all 0.2s; outline: none; }
      .trex-url-input:focus { border-color: #f0b90b; background: rgba(11, 14, 17, 0.8); box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.15); }
      .trex-url-input::placeholder { color: #5e6673; }
      .trex-launch { width: 100%; height: 48px; background: linear-gradient(135deg, #f0b90b 0%, #fcd535 100%); border: none; border-radius: 12px; color: #0b0e11; font-size: 15px; font-weight: 700; letter-spacing: 0.3px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 20px rgba(240, 185, 11, 0.3); }
      .trex-launch:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(240, 185, 11, 0.45); }
      .trex-launch:active:not(:disabled) { transform: translateY(0); }
      .trex-launch:disabled { opacity: 0.4; cursor: not-allowed; }
      .trex-launch::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); transition: left 0.5s; }
      .trex-launch:hover::before { left: 100%; }
      #trex-status { display: none; align-items: center; justify-content: center; gap: 10px; padding: 12px; margin-top: 4px; }
      .status-spinner { width: 16px; height: 16px; border: 2.5px solid rgba(88, 166, 255, 0.2); border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #trex-hint { text-align: center; font-size: 12px; color: #30363d; margin-top: 12px; min-height: 16px; transition: color 0.2s; }
      .trex-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(43, 47, 54, 0.5); font-size: 11px; color: #5e6673; }
      .trex-footer-left { display: flex; align-items: center; gap: 6px; }
      .trex-footer-dot { width: 6px; height: 6px; border-radius: 50%; background: #0ecb81; box-shadow: 0 0 8px rgba(14, 203, 129, 0.6); animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .trex-footer a { color: #848e9c; text-decoration: none; transition: color 0.15s; cursor: pointer; }
      .trex-footer a:hover { color: #f0b90b; }
      .trex-features { position: absolute; top: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
      .trex-feature { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: rgba(30, 35, 41, 0.6); border: 1px solid rgba(43, 47, 54, 0.5); border-radius: 20px; font-size: 11px; color: #848e9c; backdrop-filter: blur(10px); animation: featureIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
      .trex-feature:nth-child(1) { animation-delay: 0.3s; }
      .trex-feature:nth-child(2) { animation-delay: 0.45s; }
      .trex-feature:nth-child(3) { animation-delay: 0.6s; }
      @keyframes featureIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
      .trex-feature-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
      @media (max-width: 640px) { .trex-features { display: none; } }
      .trex-watermark { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #30363d; letter-spacing: 2px; z-index: 2; }
    </style>
  </head>
  <body>
    <div id="trex-loader">
      <div class="trex-features">
        <div class="trex-feature"><span class="trex-feature-icon">⚡</span><span>60 FPS Rendering</span></div>
        <div class="trex-feature"><span class="trex-feature-icon">🔌</span><span>Real-time WebSocket</span></div>
        <div class="trex-feature"><span class="trex-feature-icon">✏️</span><span>14 Drawing Tools</span></div>
      </div>
      <div class="trex-card">
        <div class="trex-logo">
          <div class="trex-logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polyline points="3,17 9,11 13,15 21,7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="17,7 21,7 21,11" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="trex-logo-text">TREX</div>
        </div>
        <div class="trex-tagline">Professional <strong>Trading Terminal</strong> — Built for speed</div>
        <div class="trex-modes" id="trex-modes">
          <div class="trex-mode" data-mode="demo" id="trex-mode-demo">
            <div class="trex-mode-icon"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="currentColor" fill-opacity="0.3"/></svg></div>
            <div class="trex-mode-title">Demo Mode</div>
            <div class="trex-mode-desc">Explore with simulated live data</div>
          </div>
          <div class="trex-mode" data-mode="server" id="trex-mode-server">
            <div class="trex-mode-icon"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg></div>
            <div class="trex-mode-title">Server Mode</div>
            <div class="trex-mode-desc">Connect to your WebSocket server</div>
          </div>
        </div>
        <div class="trex-url-wrap" id="trex-url-wrap">
          <input id="trex-ws-url" class="trex-url-input" type="text" placeholder="ws://localhost:8765" value="ws://localhost:8765" spellcheck="false" />
        </div>
        <div id="trex-actions">
          <button class="trex-launch" id="trex-launch-btn" disabled><span id="trex-launch-text">Select a mode to continue</span></button>
        </div>
        <div id="trex-status"></div>
        <div id="trex-hint">Choose a mode to get started</div>
        <div class="trex-footer">
          <div class="trex-footer-left"><div class="trex-footer-dot"></div><span>v1.0.0 · TradingView-grade Engine</span></div>
          <a href="#" id="trex-docs-link" onclick="window.__trexAction='docs'; return false;">📖 API Docs</a>
        </div>
      </div>
      <div class="trex-watermark">TREX TERMINAL</div>
    </div>

    <div id="root"></div>

    <script>
      window.__trexAction = null;
      window.__trexWsUrl = null;
      (function() {
        let selectedMode = null;
        const modeDemo = document.getElementById('trex-mode-demo');
        const modeServer = document.getElementById('trex-mode-server');
        const urlWrap = document.getElementById('trex-url-wrap');
        const urlInput = document.getElementById('trex-ws-url');
        const launchBtn = document.getElementById('trex-launch-btn');
        const launchText = document.getElementById('trex-launch-text');

        function selectMode(mode) {
          selectedMode = mode;
          modeDemo.classList.toggle('selected', mode === 'demo');
          modeServer.classList.toggle('selected', mode === 'server');
          if (mode === 'server') {
            urlWrap.classList.add('show');
            launchText.textContent = '🔌 Connect to Server';
            setTimeout(() => urlInput.focus(), 300);
          } else {
            urlWrap.classList.remove('show');
            launchText.textContent = '🚀 Launch Demo';
          }
          launchBtn.disabled = false;
        }
        modeDemo.addEventListener('click', () => selectMode('demo'));
        modeServer.addEventListener('click', () => selectMode('server'));
        urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && selectedMode === 'server') { launchBtn.click(); } });
        launchBtn.addEventListener('click', () => {
          if (!selectedMode) return;
          window.__trexAction = selectedMode;
          window.__trexWsUrl = urlInput.value.trim() || 'ws://localhost:8765';
          launchBtn.disabled = true;
          launchText.textContent = selectedMode === 'demo' ? 'Loading demo...' : 'Connecting...';
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
